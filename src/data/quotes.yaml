# 名言。quote 為繁中；原文是英文時另放 quote_original。編譯沒有英文原句的不補。
- id: "volker-dusch-heartbleed"
  quote: "這是 PHP 十多年來最嚴重的安全問題，並比擬 2014 年的 Heartbleed。"
  speaker: "Volker Dusch"
  role: "PHP 基金會資安工程師（鉅亨網編譯《華爾街日報》）"
  sources:
    - "2026-10-21-2240-cnyes-php-emergency-patch-heartbleed.md"
    - "2026-10-22-0848-ctwant-php-global-security-crisis.md"
- id: "php-foundation-update-now"
  quote: "如果你正在執行 PHP，現在就必須立即更新，這件事刻不容緩。"
  quote_original: "If you run PHP, it is imperative that you update now."
  speaker: "PHP 基金會"
  role: "PHP 基金會"
  sources:
    - "2026-10-21-php-foundation-security-release-strengthening.md"
    - "2026-10-22-0848-ctwant-php-global-security-crisis.md"
- id: "php-foundation-structural-failure"
  quote: "我們不打算裝作不是這樣：這次延誤是結構性失敗，原因既是安全團隊的決策方式，也是它缺乏資源。"
  quote_original: "We won't pretend otherwise: the delay was a structural failure, caused by both the security team's decision process and its lack of resources."
  speaker: "PHP 基金會"
  role: "PHP 基金會，談 2024 年為什麼沒修"
  sources:
    - "2026-10-21-php-foundation-security-release-strengthening.md"
    - "2026-10-22-0002-thenextweb-php-foundation-structural-failure.md"
- id: "wiz-most-severe"
  quote: "這些發現名列 PHP 裡被找出的最嚴重漏洞，甚至可以說名列軟體史上最嚴重的漏洞。"
  quote_original: "These findings rank among the most severe vulnerabilities discovered in PHP, and arguably in software history."
  speaker: "Wiz"
  role: "Wiz 研究員（Help Net Security 所引）"
  sources:
    - "2026-10-21-2151-helpnetsecurity-php2shell-patched.md"
- id: "wiz-one-researcher-a-week"
  quote: "一個研究者一個星期做完的事，以前要一個世界級團隊做幾個月。"
  quote_original: "a single researcher completed in a week what previously would have taken a world-class team months of work."
  speaker: "Wiz"
  role: "Wiz"
  sources:
    - "2026-10-21-2159-wiz-php2shell-ai-uncovers-rce.md"
